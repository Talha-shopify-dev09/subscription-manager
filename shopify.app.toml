# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0ff88f0c1bebc82bb6062e9a8a30c6bf"
name = "Socoba Bundle and Subscription"
application_url = "https://socoba-bundles-subscription.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01" # Using the latest stable version

  # App lifecycle and Subscription tracking
  [[webhooks.subscriptions]]
  topics = [ 
    "app/uninstalled", 
    "subscription_contracts/create", 
    "subscription_contracts/update" 
  ]
  uri = "/webhooks"

  # Mandatory compliance webhooks for public apps
  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]
  uri = "/webhooks"

[access_scopes]
# Scopes updated to include subscription and product permissions
scopes = "read_customers,write_customers,read_price_rules,write_price_rules,read_discounts,write_discounts,read_products,write_products,write_own_subscription_contracts,read_own_subscription_contracts"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://socoba-bundles-subscription.onrender.com/auth/callback",
  "https://socoba-bundles-subscription.onrender.com/auth/shopify/callback",
  "https://socoba-bundles-subscription.onrender.com/api/auth/callback"
]

[app_proxy]
# This makes your Customer Portal live at: store.com/apps/subscription-manager/portal
url = "https://socoba-bundles-subscription.onrender.com"
subpath = "subscription-manager"
prefix = "apps"