# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0ff88f0c1bebc82bb6062e9a8a30c6bf"
name = "Socoba Bundle and Subscription"
application_url = "https://apps.socoba.co"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_own_subscription_contracts,read_price_rules,read_products,write_customers,write_discounts,write_own_subscription_contracts,write_price_rules,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
 "https://apps.socoba.co/auth/callback",
  "https://apps.socoba.co/auth/shopify/callback",
  "https://apps.socoba.co/api/auth/callback"
]

[app_proxy]
url = "https://apps.socoba.co"
subpath = "subscription-manager"
prefix = "apps"
